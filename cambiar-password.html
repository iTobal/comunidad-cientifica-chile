<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio Obligatorio de Contraseña - CCCh</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 35px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            color: #fff;
            margin-top: 0;
            font-size: 20px;
            text-align: center;
            margin-bottom: 10px;
        }
        p {
            font-size: 13px;
            color: #8b949e;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        label {
            font-size: 13px;
            font-weight: bold;
            color: #c9d1d9;
            display: block;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 11px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        input:focus {
            border-color: #1f6feb;
            outline: none;
        }
        button {
            width: 100%;
            background: #238636;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #2ea043;
        }
    </style>
  <script src="api-config.js"></script>
</head>
<body>
    <div class="card">
        <h2>Cambio de Contraseña</h2>
        <p>Por seguridad, al ser tu primer ingreso con clave temporal debes asignar una nueva contraseña.</p>
        
        <form id="form-cambiar">
            <label>Nueva Contraseña</label>
            <input type="password" id="nuevaPassword" required placeholder="Ingresa tu nueva clave">
            
            <label>Confirmar Nueva Contraseña</label>
            <input type="password" id="confirmarPassword" required placeholder="Repite tu nueva clave">
            
            <button type="submit">Actualizar Contraseña</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const correo = localStorage.getItem('correoCambio');
            if (!correo) {
                alert('No hay una sesión de cambio de contraseña activa.');
                window.location.href = 'login.html';
            }
        });

        document.getElementById('form-cambiar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const correo = localStorage.getItem('correoCambio');
            const nuevaPassword = document.getElementById('nuevaPassword').value;
            const confirmarPassword = document.getElementById('confirmarPassword').value;

            if (nuevaPassword !== confirmarPassword) {
                alert('Las contraseñas no coinciden.');
                return;
            }

            if (nuevaPassword.length < 6) {
                alert('La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            try {
                const res = await fetch(apiUrl('/api/auth/cambiar-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, nuevaPassword })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('¡Contraseña actualizada con éxito! Ahora inicia sesión con tu nueva clave.');
                    localStorage.removeItem('correoCambio');
                    window.location.href = 'login.html';
                } else {
                    alert(data.error || 'Error al cambiar la contraseña.');
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión con el servidor.');
            }
        });
    </script>
</body>
</html>
